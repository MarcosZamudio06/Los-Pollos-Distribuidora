name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.14.1

jobs:
  quality:
    name: Quality and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --dir backend exec prisma generate --schema prisma/schema.prisma

      - name: Reject focused or skipped tests
        run: pnpm run test:guard

      - name: Lint backend without modifications
        run: pnpm --dir backend run lint:check

      - name: Lint frontend without modifications
        run: pnpm --dir frontend run lint

      - name: Type-check backend
        run: pnpm --dir backend run typecheck

      - name: Type-check frontend
        run: pnpm --dir frontend run typecheck

      - name: Test backend with coverage thresholds
        env:
          JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
          OPENSSL_CONF: /dev/null
        run: pnpm --dir backend run test:cov

      - name: Test frontend with coverage thresholds
        run: pnpm --dir frontend run test:cov

  database:
    name: PostgreSQL and PostGIS integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: pollos_e2e
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d pollos_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pollos_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pollos_e2e
      E2E_DATABASE_DISPOSABLE: 'true'
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
      OPENSSL_CONF: /dev/null
      PHOTON_URL: http://127.0.0.1:2322
      VROOM_URL: http://127.0.0.1:3000
      OSRM_URL: http://127.0.0.1:5000
      ROUTING_TIMEOUT_MS: 1000
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --dir backend exec prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma Client
        run: pnpm --dir backend exec prisma generate --schema prisma/schema.prisma

      - name: Apply all migrations to a clean database
        run: pnpm --dir backend exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify migration status
        run: pnpm --dir backend exec prisma migrate status --schema prisma/schema.prisma

      - name: Run integration tests
        run: pnpm --dir backend run test:e2e --runInBand

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate production Compose configuration
        env:
          CORS_ORIGIN: https://erp.example.test
          DATABASE_URL: postgresql://user:password@db:5432/app
          JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
          MAP_DATA_VERSION: mexico-latest
          OSRM_URL: https://osrm.example.test
          PHOTON_URL: https://photon.example.test
          TRUST_PROXY_HOPS: 1
          VITE_MAP_STYLE_URL: https://maps.example.test/styles/standard/style.json
          VROOM_URL: https://vroom.example.test
        run: docker compose -f docker-compose.production.yml config >/dev/null

      - name: Build backend image
        run: docker build --file docker/backend/Dockerfile --tag pollos-backend:ci .

      - name: Build frontend image
        run: docker build --file docker/frontend/Dockerfile --tag pollos-frontend:ci .

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pinned audit tool without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production dependencies
        run: pnpm run audit:dependencies

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.28.0

  gate:
    name: CI Gate
    if: always()
    needs: [quality, database, docker, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality check
        env:
          DATABASE_RESULT: ${{ needs.database.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$DATABASE_RESULT" = "success"
          test "$DOCKER_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
