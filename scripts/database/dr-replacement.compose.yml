services:
  postgres:
    image: postgis/postgis:16-3.5-alpine@sha256:becb8d49a20a2c1fcce1b154e853e1ea1a19cd5de99310852888b998694ec2ea
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dr-replacement-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [app_network]

  replacement-storage:
    image: chrislusf/seaweedfs:4.29@sha256:d47c7ee99fcb951351d7194915f4e3a5ea604a8e8871183d713907dec4fb9bf5
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: dr-replacement-access
      AWS_SECRET_ACCESS_KEY: dr-replacement-secret
      S3_BUCKET: dr-replacement-bootstrap
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8333/healthz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [app_network]

networks:
  app_network: {}
