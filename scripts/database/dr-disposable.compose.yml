services:
  postgres:
    image: postgis/postgis:16-3.5-alpine@sha256:becb8d49a20a2c1fcce1b154e853e1ea1a19cd5de99310852888b998694ec2ea
    environment:
      POSTGRES_DB: dr_fixture
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dr-disposable-only
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dr_fixture"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [app_network]

  object-storage:
    image: chrislusf/seaweedfs:4.29@sha256:d47c7ee99fcb951351d7194915f4e3a5ea604a8e8871183d713907dec4fb9bf5
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: dr-source-access
      AWS_SECRET_ACCESS_KEY: dr-source-secret
      S3_BUCKET: dr-source-bucket
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8333/healthz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [app_network]

  backup-storage:
    image: chrislusf/seaweedfs:4.29@sha256:d47c7ee99fcb951351d7194915f4e3a5ea604a8e8871183d713907dec4fb9bf5
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: dr-backup-access
      AWS_SECRET_ACCESS_KEY: dr-backup-secret
      S3_BUCKET: dr-backup-bucket
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8333/healthz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [app_network]

networks:
  app_network: {}
