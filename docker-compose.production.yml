services:
  postgres:
    image: postgis/postgis:16-3.5-alpine
    platform: ${MAP_DOCKER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pollo_distribucion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  migrate:
    profiles: ["migration"]
    image: ${BACKEND_IMAGE:-pollos-distribuidor/backend:local}
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-pollo_distribucion}
    command: npm run migrate:deploy
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  bootstrap:
    profiles: ["migration"]
    image: ${BACKEND_IMAGE:-pollos-distribuidor/backend:local}
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-pollo_distribucion}
      NODE_ENV: production
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    command: npm run bootstrap:production
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app_network

  backend:
    image: ${BACKEND_IMAGE:-pollos-distribuidor/backend:local}
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 75s
    environment:
      API_PREFIX: ${API_PREFIX:-api}
      AUTH_SESSION_ABSOLUTE_TTL_SECONDS: ${AUTH_SESSION_ABSOLUTE_TTL_SECONDS:-604800}
      AUTH_SESSION_IDLE_TTL_SECONDS: ${AUTH_SESSION_IDLE_TTL_SECONDS:-86400}
      AUTH_SESSION_LAST_USED_AT_UPDATE_THRESHOLD_SECONDS: ${AUTH_SESSION_LAST_USED_AT_UPDATE_THRESHOLD_SECONDS:-300}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      HTTP_BODY_LIMIT: ${HTTP_BODY_LIMIT:-1mb}
      DATABASE_SSL: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-pollo_distribucion}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      MAP_DATA_VERSION: ${MAP_DATA_VERSION:?MAP_DATA_VERSION is required}
      MAP_DATA_PREPARED_AT: ${MAP_DATA_PREPARED_AT:-}
      MAP_TILES_URL: http://tileserver:8080
      NODE_ENV: production
      OSRM_URL: http://osrm:5000
      PHOTON_URL: http://photon:2322
      PORT: ${PORT:-4000}
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-600}
      RATE_LIMIT_LOGIN_ACCOUNT_MAX: ${RATE_LIMIT_LOGIN_ACCOUNT_MAX:-5}
      RATE_LIMIT_LOGIN_IP_MAX: ${RATE_LIMIT_LOGIN_IP_MAX:-30}
      RATE_LIMIT_REFRESH_MAX: ${RATE_LIMIT_REFRESH_MAX:-120}
      RATE_LIMIT_FLEET_POSITION_MAX: ${RATE_LIMIT_FLEET_POSITION_MAX:-60}
      FLEET_POSITION_STALE_SECONDS: ${FLEET_POSITION_STALE_SECONDS:-60}
      FLEET_POSITION_FUTURE_TOLERANCE_SECONDS: ${FLEET_POSITION_FUTURE_TOLERANCE_SECONDS:-300}
      FLEET_ANALYTICS_MAX_RANGE_DAYS: ${FLEET_ANALYTICS_MAX_RANGE_DAYS:-31}
      FLEET_POSITION_RETENTION_DAYS: ${FLEET_POSITION_RETENTION_DAYS:-365}
      ROUTING_TIMEOUT_MS: ${ROUTING_TIMEOUT_MS:-10000}
      SWAGGER_ENABLED: "false"
      SWAGGER_PATH: ${SWAGGER_PATH:-docs}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:?TRUST_PROXY_HOPS is required}
      VROOM_URL: http://vroom:3000
    depends_on:
      postgres:
        condition: service_healthy
      photon:
        condition: service_healthy
      osrm:
        condition: service_healthy
      vroom:
        condition: service_healthy
      tileserver:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + (process.env.PORT || 4000) + '/' + (process.env.API_PREFIX || 'api') + '/health/ready')
            .then((response) => process.exit(response.ok ? 0 : 1))
            .catch(() => process.exit(1));
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - app_network

  photon:
    build:
      context: .
      dockerfile: docker/maps/photon/Dockerfile
      args:
        PHOTON_VERSION: ${PHOTON_VERSION:-1.2.1}
    image: pollos-distribuidor/photon:${PHOTON_VERSION:-1.2.1}
    platform: ${MAP_DOCKER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    volumes:
      - ${MAP_DATA_DIR:-./.map-data}/photon:/data
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:2322/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - app_network

  osrm:
    build:
      context: .
      dockerfile: docker/maps/osrm/Dockerfile
      args:
        OSRM_VERSION: ${OSRM_VERSION:-v5.27.1}
    image: pollos-distribuidor/osrm:${OSRM_VERSION:-v5.27.1}
    platform: ${MAP_DOCKER_PLATFORM:-linux/amd64}
    command: ["osrm-routed", "--algorithm", "mld", "/data/mexico-latest.osrm"]
    restart: unless-stopped
    volumes:
      - ${MAP_DATA_DIR:-./.map-data}/osrm:/data:ro
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:5000/nearest/v1/driving/-96.1342,19.1738?number=1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app_network

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:${VROOM_VERSION:-v1.15.0}
    platform: ${MAP_DOCKER_PLATFORM:-linux/amd64}
    environment:
      VROOM_ROUTER: osrm
    restart: unless-stopped
    volumes:
      - ./docker/maps/vroom/config.yml:/conf/config.yml:ro
    depends_on:
      osrm:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app_network

  tileserver:
    build:
      context: .
      dockerfile: docker/maps/tileserver/Dockerfile
    image: maptiler/tileserver-gl:v5.6.0
    platform: ${MAP_DOCKER_PLATFORM:-linux/amd64}
    command: ["--config", "/data/config.json", "--bind", "0.0.0.0", "--port", "8080", "--public_url", "/maps/", "--silent"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    volumes:
      - ${MAP_DATA_DIR:-./.map-data}/rendering:/data/rendering:ro
      - ${MAP_DATA_DIR:-./.map-data}/rendering/fonts:/data/fonts:ro
      - ./docker/maps/tileserver/config.json:/data/config.json:ro
      - ./docker/maps/styles:/data/styles:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app_network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:?VITE_MAP_STYLE_URL is required}
        REQUIRE_PUBLIC_MAP_STYLE: "true"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      tileserver:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
