x-production-logging: &production-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

x-security-stateless: &security-stateless
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-security-stateful: &security-stateful
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgis/postgis:16-3.5-alpine@sha256:becb8d49a20a2c1fcce1b154e853e1ea1a19cd5de99310852888b998694ec2ea
    <<: *security-stateful
    platform: ${MAP_DOCKER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    logging: *production-logging
    mem_limit: "${POSTGRES_MEM_LIMIT:-3.5g}"
    cpus: "${POSTGRES_CPUS:-1.25}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pollo_distribucion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  object-storage:
    image: chrislusf/seaweedfs:4.29@sha256:d47c7ee99fcb951351d7194915f4e3a5ea604a8e8871183d713907dec4fb9bf5
    <<: *security-stateful
    command: ["mini", "-dir=/data"]
    restart: unless-stopped
    logging: *production-logging
    mem_limit: "${OBJECT_STORAGE_MEM_LIMIT:-768m}"
    cpus: "${OBJECT_STORAGE_CPUS:-0.5}"
    init: true
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?OBJECT_STORAGE_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?OBJECT_STORAGE_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
    volumes:
      - object_storage_data:/data
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8333/healthz >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app_network

  migrate:
    profiles: ["migration"]
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required for production}
    <<: *security-stateless
    user: "node:node"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-pollo_distribucion}?sslmode=disable
    command: npm run migrate:deploy
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  bootstrap:
    profiles: ["migration"]
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required for production}
    <<: *security-stateless
    user: "node:node"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-pollo_distribucion}?sslmode=disable
      NODE_ENV: production
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    command: npm run bootstrap:production
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app_network

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required for production}
    <<: *security-stateless
    user: "node:node"
    restart: unless-stopped
    logging: *production-logging
    mem_limit: "${BACKEND_MEM_LIMIT:-2g}"
    cpus: "${BACKEND_CPUS:-1.25}"
    init: true
    stop_grace_period: 75s
    environment:
      API_PREFIX: ${API_PREFIX:-api}
      AUTH_SESSION_ABSOLUTE_TTL_SECONDS: ${AUTH_SESSION_ABSOLUTE_TTL_SECONDS:-604800}
      AUTH_SESSION_IDLE_TTL_SECONDS: ${AUTH_SESSION_IDLE_TTL_SECONDS:-86400}
      AUTH_SESSION_LAST_USED_AT_UPDATE_THRESHOLD_SECONDS: ${AUTH_SESSION_LAST_USED_AT_UPDATE_THRESHOLD_SECONDS:-300}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      HTTP_BODY_LIMIT: ${HTTP_BODY_LIMIT:-1mb}
      DATABASE_SSL: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-pollo_distribucion}?sslmode=disable
      # Fiscal configuration is reference-only. Credential material belongs in
      # a Docker secret or external secret manager resolved by the adapter.
      CFDI_ENABLED: ${CFDI_ENABLED:-false}
      CFDI_FISCAL_TIME_ZONE: ${CFDI_FISCAL_TIME_ZONE:-America/Mexico_City}
      FISCAL_PROVIDER: ${FISCAL_PROVIDER:-FACTURAMA}
      FISCAL_PROVIDER_ENVIRONMENT: ${FISCAL_PROVIDER_ENVIRONMENT:-PRODUCTION}
      CFDI_REQUEST_TIMEOUT_MS: ${CFDI_REQUEST_TIMEOUT_MS:-30000}
      CFDI_MAX_RETRIES: ${CFDI_MAX_RETRIES:-3}
      FACTURAMA_API_BASE_URL: ${FACTURAMA_API_BASE_URL:-}
      FACTURAMA_API_MODE: ${FACTURAMA_API_MODE:-MULTI_ISSUER}
      FACTURAMA_CREDENTIAL_REF: ${FACTURAMA_CREDENTIAL_REF:-}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      MAP_DATA_VERSION: ${MAP_DATA_VERSION:?MAP_DATA_VERSION is required}
      MAP_DATA_PREPARED_AT: ${MAP_DATA_PREPARED_AT:-}
      MAP_TILES_URL: http://tileserver:8080
      NODE_OPTIONS: "--max-old-space-size=${BACKEND_NODE_MAX_OLD_SPACE_MB:-1536}"
      NODE_ENV: production
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ENDPOINT: http://object-storage:8333
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:?OBJECT_STORAGE_PUBLIC_ENDPOINT is required}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?OBJECT_STORAGE_ACCESS_KEY_ID is required}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?OBJECT_STORAGE_SECRET_ACCESS_KEY is required}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
      OBJECT_STORAGE_SIGNED_URL_TTL_SECONDS: ${OBJECT_STORAGE_SIGNED_URL_TTL_SECONDS:-300}
      HEALTH_DEPENDENCY_TIMEOUT_MS: ${HEALTH_DEPENDENCY_TIMEOUT_MS:-5000}
      OSRM_URL: http://osrm:5000
      PHOTON_URL: http://photon:2322
      PORT: ${PORT:-4000}
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-600}
      RATE_LIMIT_LOGIN_ACCOUNT_MAX: ${RATE_LIMIT_LOGIN_ACCOUNT_MAX:-5}
      RATE_LIMIT_LOGIN_IP_MAX: ${RATE_LIMIT_LOGIN_IP_MAX:-30}
      RATE_LIMIT_REFRESH_MAX: ${RATE_LIMIT_REFRESH_MAX:-120}
      RATE_LIMIT_FLEET_POSITION_MAX: ${RATE_LIMIT_FLEET_POSITION_MAX:-60}
      FLEET_POSITION_STALE_SECONDS: ${FLEET_POSITION_STALE_SECONDS:-60}
      FLEET_POSITION_FUTURE_TOLERANCE_SECONDS: ${FLEET_POSITION_FUTURE_TOLERANCE_SECONDS:-300}
      FLEET_ANALYTICS_MAX_RANGE_DAYS: ${FLEET_ANALYTICS_MAX_RANGE_DAYS:-31}
      FLEET_POSITION_RETENTION_DAYS: ${FLEET_POSITION_RETENTION_DAYS:-365}
      ROUTING_TIMEOUT_MS: ${ROUTING_TIMEOUT_MS:-10000}
      SWAGGER_ENABLED: "false"
      SWAGGER_PATH: ${SWAGGER_PATH:-docs}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:?TRUST_PROXY_HOPS is required}
      VROOM_URL: http://vroom:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + (process.env.PORT || 4000) + '/' + (process.env.API_PREFIX || 'api') + '/health/ready')
            .then((response) => process.exit(response.ok ? 0 : 1))
            .catch(() => process.exit(1));
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - app_network

  photon:
    image: ${PHOTON_IMAGE:?PHOTON_IMAGE is required for production}
    <<: *security-stateless
    platform: ${MAP_DOCKER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    logging: *production-logging
    mem_limit: "${PHOTON_MEM_LIMIT:-6g}"
    cpus: "${PHOTON_CPUS:-1.5}"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms${PHOTON_JAVA_XMS:-1g} -Xmx${PHOTON_JAVA_XMX:-4g}"
    volumes:
      - "${MAP_DATA_DIR:?MAP_DATA_DIR is required for production}/photon:/data"
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:2322/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - app_network

  osrm:
    image: ${OSRM_IMAGE:?OSRM_IMAGE is required for production}
    <<: *security-stateless
    platform: ${MAP_DOCKER_PLATFORM:-linux/amd64}
    user: "65534:65534"
    command: ["osrm-routed", "--algorithm", "mld", "/data/mexico-latest.osrm"]
    restart: unless-stopped
    logging: *production-logging
    mem_limit: "${OSRM_MEM_LIMIT:-5g}"
    cpus: "${OSRM_CPUS:-1.5}"
    volumes:
      - "${MAP_DATA_DIR:?MAP_DATA_DIR is required for production}/osrm:/data:ro"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:5000/nearest/v1/driving/-96.1342,19.1738?number=1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app_network

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.15.0@sha256:247d5683d6745c755d718a156d16b16aac80baccc276a003a68b986c13883b08
    <<: *security-stateless
    platform: ${MAP_DOCKER_PLATFORM:-linux/amd64}
    user: "node:node"
    working_dir: /vroom-express
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /tmp/vroom && exec node /vroom-express/src/index.js
    environment:
      VROOM_ROUTER: osrm
      VROOM_LOG: /tmp/vroom
    restart: unless-stopped
    logging: *production-logging
    mem_limit: "${VROOM_MEM_LIMIT:-1g}"
    cpus: "${VROOM_CPUS:-0.5}"
    volumes:
      - ./docker/maps/vroom/config.yml:/conf/config.yml:ro
      - ./docker/maps/vroom/config.yml:/vroom-express/config.yml:ro
    depends_on:
      osrm:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app_network

  tileserver:
    image: ${TILESERVER_IMAGE:?TILESERVER_IMAGE is required for production}
    <<: *security-stateless
    platform: ${MAP_DOCKER_PLATFORM:-linux/amd64}
    user: "node:node"
    command:
      [
        "--config",
        "/data/config.json",
        "--bind",
        "0.0.0.0",
        "--port",
        "8080",
        "--public_url",
        "/maps/",
        "--silent",
      ]
    restart: unless-stopped
    logging: *production-logging
    mem_limit: "${TILESERVER_MEM_LIMIT:-1.5g}"
    cpus: "${TILESERVER_CPUS:-0.5}"
    volumes:
      - "${MAP_DATA_DIR:?MAP_DATA_DIR is required for production}/rendering:/data/rendering:ro"
      - "${MAP_DATA_DIR:?MAP_DATA_DIR is required for production}/rendering/fonts:/data/fonts:ro"
      - ./docker/maps/tileserver/config.json:/data/config.json:ro
      - ./docker/maps/styles:/data/styles:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app_network

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required for production}
    <<: *security-stateless
    restart: unless-stopped
    logging: *production-logging
    mem_limit: "${FRONTEND_MEM_LIMIT:-512m}"
    cpus: "${FRONTEND_CPUS:-0.5}"
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101,mode=0755
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null --tries=1 --timeout=3 http://127.0.0.1:3000/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - app_network

volumes:
  postgres_data:
  object_storage_data:

networks:
  app_network:
    driver: bridge
